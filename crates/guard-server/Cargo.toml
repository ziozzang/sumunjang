[package]
name = "guard-server"
default-run = "sumunjang"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "sumunjang"
path = "src/main.rs"

# Compatibility executable for existing installations.
[[bin]]
name = "hangang-guard"
path = "src/main.rs"

[dependencies]
hangang-runtime = { git = "https://github.com/ziozzang/hangang-runtime", rev = "0cdbd1660cefe46eed8bab3c0deb1b62c560ecf6" }
guard-grpc = { path = "../guard-grpc" }
tonic = { version = "0.14.6", features = ["tls-ring"] }
tokio-stream = { version = "0.1", features = ["net"] }
arc-swap = "1"
maxminddb = { version = "0.32", default-features = false }
mlua = { version = "0.11", features = ["lua54", "vendored", "send", "serialize"] }
guard-core = { path = "../guard-core" }
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
ring = "0.17"
base64 = "0.22"
ipnet = "2"
prost = "0.14"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }

guard-update = { path = "../guard-update" }
libc = "0.2"
semver = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tempfile = "3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"

[dev-dependencies]
rcgen = "0.14"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"